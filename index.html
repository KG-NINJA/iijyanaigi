<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>黄泉脱出 3D迷宮RPG</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      --ink: #100b11;
      --yomi: #151016;
      --ash: #242126;
      --bone: #f2e7cf;
      --muted: #b7ab96;
      --gold: #d6aa58;
      --red: #b83232;
      --cyan: #76d7d0;
      --panel: rgba(16, 11, 17, 0.72);
      --line: rgba(242, 218, 158, 0.28);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 18%, rgba(139, 42, 45, 0.24), transparent 32%),
        radial-gradient(circle at 20% 80%, rgba(118, 215, 208, 0.12), transparent 30%),
        linear-gradient(180deg, #09070a 0%, var(--yomi) 52%, #060507 100%);
      color: var(--bone);
      font-family: "Yu Gothic UI", "Hiragino Sans", "Segoe UI", system-ui, sans-serif;
    }
    #stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: clamp(18px, 4vw, 48px);
    }
    #izanagiFrame {
      position: relative;
      width: min(92vw, 1220px);
      height: min(84vh, 760px);
      padding: clamp(22px, 4.2vw, 58px);
      border-radius: 28px;
      background:
        url("assets/izanagi-frame.svg") center / cover no-repeat,
        conic-gradient(from 42deg, #4b1218, #c0964f, #27151b, #ece0bc, #692327, #4b1218);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.62),
        inset 0 0 0 2px rgba(255, 232, 168, 0.42),
        inset 0 0 56px rgba(0, 0, 0, 0.54);
      isolation: isolate;
    }
    #izanagiFrame::before {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 22px;
      border: 2px solid rgba(244, 219, 146, 0.46);
      background:
        radial-gradient(circle at 9% 18%, rgba(242, 221, 169, 0.42) 0 3px, transparent 4px),
        radial-gradient(circle at 91% 82%, rgba(242, 221, 169, 0.36) 0 3px, transparent 4px),
        linear-gradient(90deg, transparent 0 7%, rgba(8, 5, 8, 0.22) 9% 91%, transparent 93% 100%);
      pointer-events: none;
      z-index: 2;
    }
    #izanagiFrame::after {
      content: "伊邪那岐";
      position: absolute;
      left: 50%;
      top: 18px;
      transform: translateX(-50%);
      padding: 3px 20px 6px;
      border: 1px solid rgba(255, 226, 157, 0.4);
      border-radius: 999px;
      background: rgba(10, 7, 10, 0.72);
      color: #ffe2a2;
      font-weight: 900;
      letter-spacing: 0.34em;
      text-indent: 0.34em;
      z-index: 4;
      text-shadow: 0 0 18px rgba(255, 200, 90, 0.55);
    }
    #viewport {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 16px;
      background:
        linear-gradient(rgba(7, 5, 8, 0.24), rgba(7, 5, 8, 0.72)),
        url("assets/yomi-background.png") center / cover no-repeat,
        #0b0d10;
      box-shadow:
        inset 0 0 0 2px rgba(255, 233, 174, 0.34),
        inset 0 0 60px rgba(0, 0, 0, 0.72);
      z-index: 1;
    }
    #viewport.shake {
      animation: hitShake 180ms linear;
    }
    @keyframes hitShake {
      0%, 100% { transform: translate3d(0, 0, 0); }
      20% { transform: translate3d(-7px, 3px, 0); }
      40% { transform: translate3d(6px, -4px, 0); }
      60% { transform: translate3d(-4px, -2px, 0); }
      80% { transform: translate3d(4px, 2px, 0); }
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #hud {
      position: absolute;
      inset: 14px 14px auto 14px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      z-index: 8;
      pointer-events: none;
    }
    .chip, #hint, #battle, #message {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(12px);
    }
    .chip {
      border-radius: 8px;
      padding: 9px 11px;
      min-width: 230px;
      font-size: 12px;
      line-height: 1.45;
    }
    .chip b {
      color: #ffdc86;
      font-size: 13px;
    }
    #stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      color: var(--muted);
      margin-top: 4px;
    }
    #stats strong { color: var(--bone); }
    #hint {
      border-radius: 8px;
      padding: 9px 11px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      text-align: right;
      max-width: 310px;
    }
    #battle {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(94%, 980px);
      border-radius: 10px;
      padding: 18px 18px 16px;
      z-index: 10;
      display: none;
      text-align: left;
      overflow: hidden;
    }
    #battle.active {
      display: block;
      animation: battleIn 220ms ease-out;
    }
    #battle.bossBattle {
      border-color: rgba(255, 86, 54, 0.72);
      box-shadow:
        0 0 0 1px rgba(255, 210, 112, .22),
        0 24px 70px rgba(110, 8, 12, .54),
        inset 0 0 54px rgba(255, 60, 32, .14);
    }
    #battle::before {
      content: "";
      position: fixed;
      inset: -100vh -100vw;
      background: rgba(3, 2, 4, 0.72);
      z-index: -1;
    }
    #battleTitle {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-weight: 900;
      color: #ffdc86;
      margin-bottom: 10px;
    }
    #playerBattleStatus {
      color: #f2e7cf;
      text-align: center;
      font-size: 18px;
      text-shadow: 0 0 14px rgba(255, 70, 45, .5);
      min-width: 250px;
      position: relative;
      padding-bottom: 8px;
    }
    #playerBattleStatus::after,
    #battleHp::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 4px;
      border-radius: 999px;
      background:
        linear-gradient(90deg, #77f4dc var(--player-hp, 100%), rgba(255, 255, 255, .12) var(--player-hp, 100%));
      box-shadow: 0 0 14px rgba(118, 215, 208, .34);
    }
    #battleHp {
      min-width: 142px;
      text-align: right;
      position: relative;
      padding-bottom: 8px;
    }
    #battleHp::after {
      background:
        linear-gradient(90deg, #ff5948 var(--enemy-hp, 100%), rgba(255, 255, 255, .12) var(--enemy-hp, 100%));
      box-shadow: 0 0 14px rgba(255, 70, 45, .42);
    }
    #battleBody {
      display: grid;
      grid-template-columns: minmax(320px, 58%) 1fr;
      gap: 18px;
      align-items: stretch;
      margin-bottom: 12px;
    }
    #battlePortrait {
      width: 100%;
      height: min(58vh, 520px);
      border: 1px solid rgba(255, 226, 157, 0.34);
      border-radius: 8px;
      background: radial-gradient(circle at 50% 38%, rgba(214, 170, 88, .22), rgba(30, 12, 16, .96));
      image-rendering: auto;
      box-shadow:
        0 20px 55px rgba(0, 0, 0, .52),
        inset 0 0 60px rgba(255, 210, 112, .12);
    }
    #battlePortrait.defeatFade {
      animation: defeatFade 1100ms ease-in forwards;
    }
    #battlePortrait.bossDefeatFade {
      animation: bossDefeatFade 2600ms ease-in forwards;
    }
    #hitFlash, #slashEffect {
      position: absolute;
      inset: 0;
      z-index: 11;
      pointer-events: none;
      opacity: 0;
    }
    #hitFlash.flash {
      animation: hitFlash 260ms ease-out;
    }
    #hitFlash.enemyFlash {
      animation: enemyHitFlash 560ms ease-out;
    }
    #hitFlash.purifyFlash {
      animation: purifyHitFlash 620ms ease-out;
    }
    #hitFlash.healFlash {
      animation: healFlash 700ms ease-out;
    }
    #hitFlash.guardFlash {
      animation: guardFlash 520ms ease-out;
    }
    #hitFlash.bossFlash {
      animation: bossFlash 920ms ease-out;
    }
    #hitFlash.victoryFlash {
      animation: victoryFlash 1450ms ease-out;
    }
    #slashEffect.slash {
      animation: slashFlash 320ms ease-out;
    }
    #slashEffect.enemyStrike {
      animation: enemyStrikeFlash 560ms ease-out;
    }
    #slashEffect.purifyWave {
      animation: purifyWave 720ms ease-out;
    }
    #slashEffect.guardRing {
      animation: guardRing 620ms ease-out;
    }
    #slashEffect::before, #slashEffect::after {
      content: "";
      position: absolute;
      left: 16%;
      top: 48%;
      width: 70%;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, #fff7d0 25%, #ffef98 46%, #b83232 78%, transparent);
      box-shadow: 0 0 20px rgba(255, 238, 150, .95), 0 0 46px rgba(184, 50, 50, .75);
      transform: rotate(-24deg);
    }
    #slashEffect::after {
      top: 43%;
      transform: rotate(18deg);
      opacity: .65;
    }
    #slashEffect.enemyStrike::before {
      left: 5%;
      top: 44%;
      width: 90%;
      height: 16px;
      background: linear-gradient(90deg, transparent, #ffef98 16%, #ff2d2d 48%, #6b0610 82%, transparent);
      box-shadow: 0 0 28px rgba(255, 52, 52, .95), 0 0 72px rgba(255, 180, 80, .82);
      transform: rotate(10deg);
    }
    #slashEffect.enemyStrike::after {
      left: 8%;
      top: 54%;
      width: 84%;
      height: 14px;
      background: linear-gradient(90deg, transparent, #ffffff 12%, #ff6538 42%, #9b0715 72%, transparent);
      transform: rotate(-16deg);
      opacity: .92;
    }
    #slashEffect.purifyWave::before,
    #slashEffect.purifyWave::after {
      left: 22%;
      top: 50%;
      width: 56%;
      height: 56%;
      border: 4px solid rgba(168, 255, 241, .86);
      border-radius: 999px;
      background: radial-gradient(circle, rgba(255,255,255,.62), rgba(118,215,208,.18) 38%, transparent 64%);
      box-shadow: 0 0 34px rgba(118, 215, 208, .86), inset 0 0 40px rgba(255,255,255,.25);
      transform: translateY(-50%) scale(.45);
    }
    #slashEffect.purifyWave::after {
      border-color: rgba(255, 229, 150, .72);
      transform: translateY(-50%) scale(.2);
      opacity: .7;
    }
    #slashEffect.guardRing::before,
    #slashEffect.guardRing::after {
      left: 30%;
      top: 50%;
      width: 40%;
      height: 40%;
      border: 5px solid rgba(255, 228, 150, .78);
      border-radius: 999px;
      background: transparent;
      box-shadow: 0 0 22px rgba(255, 220, 130, .72), inset 0 0 24px rgba(255, 220, 130, .2);
      transform: translateY(-50%) scale(.8);
    }
    #slashEffect.guardRing::after {
      border-color: rgba(118, 215, 208, .64);
      transform: translateY(-50%) scale(.55);
    }
    .floatText {
      position: absolute;
      left: 50%;
      top: 42%;
      z-index: 14;
      pointer-events: none;
      font-weight: 1000;
      font-size: clamp(22px, 4vw, 44px);
      color: #fff0b0;
      text-shadow:
        0 3px 0 rgba(0,0,0,.64),
        0 0 18px rgba(255, 210, 112, .95),
        0 0 44px rgba(184, 50, 50, .75);
      transform: translate(-50%, 0);
      animation: floatText 980ms ease-out forwards;
      white-space: nowrap;
    }
    .floatText.good {
      color: #b7fff4;
      text-shadow: 0 3px 0 rgba(0,0,0,.62), 0 0 22px rgba(118, 215, 208, .95);
    }
    .floatText.bad {
      color: #ffb0a0;
      text-shadow: 0 3px 0 rgba(0,0,0,.66), 0 0 24px rgba(255, 60, 32, .95);
    }
    @keyframes battleIn {
      from { opacity: 0; transform: translate(-50%, -48%) scale(.97); filter: blur(4px); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); }
    }
    @keyframes hitFlash {
      0% { opacity: 0; background: rgba(255,255,255,0); }
      22% { opacity: 1; background: rgba(255, 242, 190, .52); }
      100% { opacity: 0; background: rgba(184, 50, 50, 0); }
    }
    @keyframes enemyHitFlash {
      0% { opacity: 0; background: rgba(255,0,0,0); }
      18% { opacity: 1; background: radial-gradient(circle, rgba(255,255,255,.78), rgba(255,43,35,.56) 44%, rgba(55,0,0,.22)); }
      42% { opacity: .82; background: rgba(180, 0, 18, .48); }
      100% { opacity: 0; background: rgba(80, 0, 0, 0); }
    }
    @keyframes purifyHitFlash {
      0% { opacity: 0; background: rgba(118,215,208,0); }
      22% { opacity: 1; background: radial-gradient(circle, rgba(255,255,255,.74), rgba(118,215,208,.48) 42%, rgba(214,170,88,.18)); }
      100% { opacity: 0; background: rgba(118,215,208,0); }
    }
    @keyframes healFlash {
      0% { opacity: 0; background: rgba(118,215,208,0); }
      28% { opacity: 1; background: radial-gradient(circle, rgba(200,255,238,.48), rgba(118,215,208,.25) 46%, transparent); }
      100% { opacity: 0; background: transparent; }
    }
    @keyframes guardFlash {
      0% { opacity: 0; background: rgba(255,220,130,0); }
      24% { opacity: .9; background: radial-gradient(circle, rgba(255,236,170,.34), rgba(118,215,208,.22) 50%, transparent); }
      100% { opacity: 0; background: transparent; }
    }
    @keyframes bossFlash {
      0% { opacity: 0; background: rgba(255,0,0,0); }
      18% { opacity: 1; background: radial-gradient(circle, rgba(255,231,160,.6), rgba(184,50,50,.54) 44%, rgba(30,0,0,.4)); }
      46% { opacity: .75; background: rgba(80,0,0,.46); }
      100% { opacity: 0; background: transparent; }
    }
    @keyframes victoryFlash {
      0% { opacity: 0; background: rgba(255,255,255,0); }
      26% { opacity: 1; background: radial-gradient(circle, rgba(255,255,255,.86), rgba(255,226,157,.5) 42%, rgba(118,215,208,.24)); }
      100% { opacity: 0; background: rgba(255,255,255,0); }
    }
    @keyframes slashFlash {
      0% { opacity: 0; transform: scale(.85); }
      22% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.08); }
    }
    @keyframes enemyStrikeFlash {
      0% { opacity: 0; transform: scale(.7) rotate(-4deg); filter: blur(2px); }
      18% { opacity: 1; transform: scale(1.04) rotate(0deg); filter: blur(0); }
      48% { opacity: .88; transform: scale(1.12) rotate(2deg); }
      100% { opacity: 0; transform: scale(1.24) rotate(5deg); filter: blur(3px); }
    }
    @keyframes purifyWave {
      0% { opacity: 0; transform: scale(.58); filter: blur(2px); }
      20% { opacity: 1; transform: scale(.9); filter: blur(0); }
      100% { opacity: 0; transform: scale(1.36); filter: blur(5px); }
    }
    @keyframes guardRing {
      0% { opacity: 0; transform: scale(.75); }
      26% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.18); }
    }
    @keyframes floatText {
      0% { opacity: 0; transform: translate(-50%, 18px) scale(.8); }
      18% { opacity: 1; transform: translate(-50%, -4px) scale(1.08); }
      100% { opacity: 0; transform: translate(-50%, -74px) scale(.92); }
    }
    @keyframes defeatFade {
      0% { opacity: 1; transform: scale(1); filter: brightness(1.2) contrast(1.05); }
      18% { opacity: 1; transform: scale(1.04); filter: brightness(2.4) saturate(1.5); }
      46% { opacity: .62; transform: scale(.96); filter: brightness(.8) saturate(.35) blur(1px); }
      100% { opacity: 0; transform: scale(.84) translateY(24px); filter: brightness(.15) saturate(0) blur(6px); }
    }
    @keyframes bossDefeatFade {
      0% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); filter: brightness(1.25) contrast(1.08); }
      12% { opacity: 1; transform: translate3d(-5px, 2px, 0) scale(1.035); filter: brightness(2.2) saturate(1.3); }
      24% { opacity: .92; transform: translate3d(6px, -3px, 0) scale(1.01); filter: brightness(1.35) contrast(1.2); }
      38% { opacity: .78; transform: translate3d(-4px, 4px, 0) scale(.98); filter: brightness(.75) saturate(.5); }
      54% { opacity: .56; transform: translate3d(5px, 2px, 0) scale(.94); filter: brightness(.45) saturate(.24) blur(1px); }
      72% { opacity: .32; transform: translate3d(-3px, 8px, 0) scale(.88); filter: brightness(.25) saturate(.1) blur(3px); }
      100% { opacity: 0; transform: translate3d(0, 38px, 0) scale(.76); filter: brightness(.08) saturate(0) blur(9px); }
    }
    #battleLog {
      min-height: 100%;
      color: var(--bone);
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      padding: 16px;
      border: 1px solid rgba(255, 226, 157, 0.22);
      border-radius: 8px;
      background: rgba(8, 5, 8, .48);
    }
    #actions {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }
    button {
      min-height: 42px;
      border: 1px solid rgba(255, 226, 157, 0.34);
      border-radius: 8px;
      background: rgba(34, 28, 28, 0.92);
      color: var(--bone);
      font-weight: 800;
      cursor: pointer;
    }
    button:hover, button:focus-visible {
      outline: none;
      background: rgba(80, 38, 38, 0.98);
      border-color: rgba(255, 226, 157, 0.72);
    }
    button:disabled {
      cursor: wait;
      opacity: .45;
    }
    #message {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 12;
      width: min(88%, 520px);
      border-radius: 10px;
      padding: 22px;
      text-align: center;
      display: none;
    }
    #message.active { display: block; }
    #message h1 {
      margin: 0 0 10px;
      color: #ffdc86;
      font-size: clamp(24px, 4vw, 42px);
      letter-spacing: 0;
    }
    #message p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.6;
    }
    #endingScene {
      position: absolute;
      inset: 0;
      z-index: 13;
      display: none;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(4, 2, 5, .12), rgba(6, 4, 8, .48)),
        url("assets/yomi-background.png") center / cover no-repeat,
        #08070a;
      pointer-events: auto;
    }
    #endingScene.active {
      display: block;
      animation: endingFadeIn 900ms ease-out both;
    }
    #endingScene::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 78%, rgba(255, 238, 172, .34), transparent 18%),
        radial-gradient(circle at 50% 35%, rgba(118, 215, 208, .24), transparent 33%),
        linear-gradient(180deg, rgba(255, 242, 184, .18), transparent 35%, rgba(0, 0, 0, .3));
      mix-blend-mode: screen;
      animation: endingSkyPulse 4.8s ease-in-out infinite;
    }
    #endingScene::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -12%;
      width: min(42vw, 460px);
      height: 115%;
      transform: translateX(-50%);
      background:
        linear-gradient(90deg, transparent, rgba(255, 245, 190, .34), rgba(255, 255, 255, .62), rgba(118, 215, 208, .28), transparent);
      filter: blur(18px);
      opacity: .72;
      animation: endingBeam 3.8s ease-in-out infinite;
    }
    .endingOrb {
      position: absolute;
      left: 50%;
      bottom: 10%;
      width: clamp(72px, 9vw, 128px);
      aspect-ratio: 1;
      border-radius: 50%;
      transform: translateX(-50%);
      background:
        radial-gradient(circle at 34% 28%, #ffffff 0 10%, #fff7c8 22%, #ffd56a 48%, rgba(118, 215, 208, .86) 72%, rgba(118, 215, 208, 0) 100%);
      box-shadow:
        0 0 28px rgba(255, 246, 198, .98),
        0 0 72px rgba(255, 214, 100, .85),
        0 0 140px rgba(118, 215, 208, .58);
      animation: orbAscend 7.2s cubic-bezier(.16, .68, .18, 1) infinite;
    }
    .endingOrb::before,
    .endingOrb::after {
      content: "";
      position: absolute;
      inset: -90%;
      border-radius: 50%;
      border: 2px solid rgba(255, 244, 188, .46);
      animation: orbRing 2.4s ease-out infinite;
    }
    .endingOrb::after {
      inset: -48%;
      border-color: rgba(118, 215, 208, .5);
      animation-delay: .55s;
    }
    .endingSpark {
      position: absolute;
      left: 50%;
      bottom: 8%;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #fff2aa;
      box-shadow: 0 0 14px rgba(255, 242, 170, .9);
      opacity: 0;
      animation: endingSparkRise 4.2s ease-in-out infinite;
    }
    .endingSpark:nth-child(2) { margin-left: -140px; animation-delay: .2s; }
    .endingSpark:nth-child(3) { margin-left: 120px; animation-delay: .8s; background: #a9fff1; }
    .endingSpark:nth-child(4) { margin-left: -54px; animation-delay: 1.35s; }
    .endingSpark:nth-child(5) { margin-left: 72px; animation-delay: 1.85s; background: #ffffff; }
    .endingCopy {
      position: absolute;
      left: 50%;
      bottom: clamp(22px, 5vh, 54px);
      width: min(88%, 620px);
      transform: translateX(-50%);
      text-align: center;
      color: #fff2bf;
      text-shadow: 0 3px 18px rgba(0,0,0,.86), 0 0 32px rgba(255, 214, 100, .6);
    }
    .endingCopy h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 5vw, 58px);
      letter-spacing: 0;
    }
    .endingCopy p {
      margin: 0 0 18px;
      color: rgba(255, 244, 205, .86);
      line-height: 1.65;
      font-weight: 700;
    }
    .endingCopy button {
      min-width: 180px;
      background: rgba(68, 36, 20, .9);
    }
    @keyframes endingFadeIn {
      from { opacity: 0; filter: brightness(1.8) blur(8px); }
      to { opacity: 1; filter: brightness(1) blur(0); }
    }
    @keyframes endingSkyPulse {

</head>
<body>
  <main id="stage">

  <script type="module">
    import * as THREE from "three";

    const viewport = document.getElementById("viewport");
    const hpText = document.getElementById("hpText");
    const enemyText = document.getElementById("enemyText");
    const battle = document.getElementById("battle");
    const battleName = document.getElementById("battleName");
    const battleHp = document.getElementById("battleHp");
    const playerBattleStatus = document.getElementById("playerBattleStatus");
    const battleLog = document.getElementById("battleLog");
    const battlePortrait = document.getElementById("battlePortrait");
    const battlePortraitCtx = battlePortrait.getContext("2d");
    const message = document.getElementById("message");
    const messageTitle = document.getElementById("messageTitle");
    const messageBody = document.getElementById("messageBody");
    const endingScene = document.getElementById("endingScene");
    const hitFlash = document.getElementById("hitFlash");
    const slashEffect = document.getElementById("slashEffect");
    const actionButtons = [...document.querySelectorAll("[data-action]")];
    let audioCtx = null;

    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    function tone(freq, duration, type = "sine", gain = 0.08, delay = 0) {
      const ctx = ensureAudio();
      const osc = ctx.createOscillator();
      const amp = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
      amp.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
      amp.gain.exponentialRampToValueAtTime(gain, ctx.currentTime + delay + 0.012);
      amp.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + duration);
      osc.connect(amp).connect(ctx.destination);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + duration + 0.02);
    }

    function chord(notes, duration, type = "sine", gain = 0.045, stagger = 0.025) {
      notes.forEach((freq, index) => tone(freq, duration, type, gain, index * stagger));
    }

    function sweep(start, end, duration, type = "sawtooth", gain = 0.06, delay = 0) {
      const ctx = ensureAudio();
      const osc = ctx.createOscillator();
      const amp = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(start, ctx.currentTime + delay);
      osc.frequency.exponentialRampToValueAtTime(end, ctx.currentTime + delay + duration);
      amp.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
      amp.gain.exponentialRampToValueAtTime(gain, ctx.currentTime + delay + 0.02);
      amp.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + duration);
      osc.connect(amp).connect(ctx.destination);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + duration + 0.04);
    }

    function noiseHit(duration = 0.12, gain = 0.14) {
      const ctx = ensureAudio();
      const buffer = ctx.createBuffer(1, ctx.sampleRate * duration, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i += 1) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
      const source = ctx.createBufferSource();
      const filter = ctx.createBiquadFilter();
      const amp = ctx.createGain();
      filter.type = "lowpass";
      filter.frequency.value = 620;
      amp.gain.value = gain;
      source.buffer = buffer;
      source.connect(filter).connect(amp).connect(ctx.destination);
      source.start();
    }

    function playStep() {
      tone(92, 0.07, "triangle", 0.035);
      tone(58, 0.05, "sine", 0.025, 0.035);
    }

    function playSlash() {
      sweep(960, 180, 0.16, "sawtooth", 0.058);
      tone(1180, 0.08, "triangle", 0.04, 0.025);
      noiseHit(0.09, 0.06);
    }

    function playCritical() {
      sweep(1320, 180, 0.24, "sawtooth", 0.08);
      chord([784, 1175, 1568], 0.16, "triangle", 0.045, 0.018);
      noiseHit(0.13, 0.12);
    }

    function playGuard() {
      chord([196, 294, 392], 0.18, "triangle", 0.042, 0.025);
      tone(146, 0.16, "sine", 0.035);
    }

    function playImpact() {
      tone(62, 0.18, "square", 0.09);
      sweep(210, 55, 0.18, "sawtooth", 0.052);
      noiseHit(0.16, 0.17);
    }

    function playDefeatBoom() {
      tone(42, 0.42, "sawtooth", 0.13);
      tone(31, 0.56, "sine", 0.12, 0.05);
      tone(86, 0.24, "square", 0.07, 0.08);
      noiseHit(0.28, 0.18);
      if (navigator.vibrate) navigator.vibrate([70, 35, 90]);
    }

    function playBossQuake() {
      tone(28, 1.4, "sawtooth", 0.16);
      tone(36, 1.9, "sine", 0.14, 0.12);
      tone(22, 2.2, "triangle", 0.12, 0.28);
      noiseHit(0.72, 0.22);
      if (navigator.vibrate) navigator.vibrate([120, 80, 180, 80, 240]);
    }

    function playPurify() {
      chord([523, 659, 988], 0.24, "sine", 0.045, 0.035);
      sweep(340, 1240, 0.34, "triangle", 0.04, 0.03);
    }

    function playHeal() {
      tone(523, 0.18, "sine", 0.05);
      tone(784, 0.22, "triangle", 0.04, 0.08);
      tone(1046, 0.18, "sine", 0.035, 0.16);
    }

    function playBattleStart(isBoss = false) {
      if (isBoss) {
        tone(42, 0.48, "sawtooth", 0.11);
        sweep(90, 28, 0.62, "sawtooth", 0.09, 0.08);
        noiseHit(0.32, 0.16);
        return;
      }
      chord([174, 220, 329], 0.2, "triangle", 0.032, 0.035);
      tone(90, 0.18, "sine", 0.034);
    }

    function playVictory() {
      chord([392, 523, 659, 1046], 0.52, "sine", 0.052, 0.055);
      chord([659, 784, 1046], 0.62, "triangle", 0.04, 0.12);
    }

    function showFloat(text, kind = "") {
      const el = document.createElement("div");
      el.className = `floatText ${kind}`.trim();
      el.textContent = text;
      viewport.appendChild(el);
      window.setTimeout(() => el.remove(), 1050);
    }

    function triggerImpact(kind = "slash") {
      if (navigator.vibrate) navigator.vibrate(kind === "heavy" ? [45, 24, 45] : 45);
      viewport.classList.remove("shake");
      ["flash", "enemyFlash", "purifyFlash", "healFlash", "guardFlash", "bossFlash", "victoryFlash"].forEach((name) => hitFlash.classList.remove(name));
      ["slash", "enemyStrike", "purifyWave", "guardRing"].forEach((name) => slashEffect.classList.remove(name));
      void viewport.offsetWidth;
      if (kind !== "heal" && kind !== "guard" && kind !== "victory") viewport.classList.add("shake");
      if (kind === "enemy") {
        hitFlash.classList.add("enemyFlash");
        slashEffect.classList.add("enemyStrike");
      } else if (kind === "purify") {
        hitFlash.classList.add("purifyFlash");
        slashEffect.classList.add("purifyWave");
      } else if (kind === "heal") {
        hitFlash.classList.add("healFlash");
      } else if (kind === "guard") {
        hitFlash.classList.add("guardFlash");
        slashEffect.classList.add("guardRing");
      } else if (kind === "boss") {
        hitFlash.classList.add("bossFlash");
        slashEffect.classList.add("enemyStrike");
      } else if (kind === "victory") {
        hitFlash.classList.add("victoryFlash");
        slashEffect.classList.add("purifyWave");
      } else if (kind === "heavy") {
        hitFlash.classList.add("flash");
        slashEffect.classList.add("slash");
      } else {
        hitFlash.classList.add("flash");
        if (kind === "slash") slashEffect.classList.add("slash");
      }
    }

    const TILE = 2.6;
    const maze = [
      "#############",
      "#P..#.......#",
      "#.#.#.###.#.#",
      "#.#...#...#.#",
      "#.#####.###.#",
      "#.....#...#.#",
      "###.#.###.#.#",
      "#...#.....ME#",
      "#.#######.#.#",
      "#.....M...#.#",
      "#.###.###...#",
      "#...M...#...#",
      "#############"
    ];
    const state = {
      mode: "explore",
      hp: 34,
      maxHp: 34,
      potions: 3,
      player: { x: 1, y: 1 },
      facing: 1,
      yaw: Math.PI / 2,
      targetYaw: Math.PI / 2,
      target: new THREE.Vector3(),
      activeEnemy: null,
      battleBusy: false,
      guardBonus: 0,
      defeated: 0,
      turn: 0,
      moveLock: 0,
      messageAge: 0
    };
    const enemies = [
      { id: 1, name: "黄泉軍", x: 6, y: 9, hp: 14, maxHp: 14, atk: 3, rewardHp: 4, state: "patrol", dir: 1, mesh: null, useSheet: true },
      { id: 2, name: "穢れ火", x: 4, y: 11, hp: 16, maxHp: 16, atk: 4, rewardHp: 5, weakPurify: true, state: "patrol", dir: -1, mesh: null, useSheet: true },
      { id: 3, name: "坂守", x: 9, y: 3, hp: 21, maxHp: 21, atk: 5, rewardHp: 6, armored: true, state: "patrol", dir: 1, mesh: null, useSheet: true },
      { id: 4, name: "黄泉中将", x: 10, y: 7, hp: 42, maxHp: 42, atk: 6, rewardHp: 0, state: "patrol", dir: 0, boss: true, routeIndex: 0, mesh: null, useSheet: true }
    ];
    const enemySheet = new Image();
    enemySheet.decoding = "async";
    let enemySheetReady = false;
    let enemySheetFailed = false;
    enemySheet.onload = () => {
      enemySheetReady = true;
      if (state.activeEnemy) drawBattlePortrait(state.activeEnemy);
    };
    enemySheet.onerror = () => {
      enemySheetFailed = true;
      if (state.activeEnemy) drawBattlePortrait(state.activeEnemy);
    };
    enemySheet.src = "assets/enemy-sheet.png?v=illustration-2";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x08070a);
    scene.fog = new THREE.Fog(0x08070a, 18, 54);

    const textureLoader = new THREE.TextureLoader();
    textureLoader.load("assets/yomi-background.png", (texture) => {
      texture.colorSpace = THREE.SRGBColorSpace;
      scene.background = texture;
    });

    const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 120);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.22;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    viewport.appendChild(renderer.domElement);

    const root = new THREE.Group();
    scene.add(root);

    const hemi = new THREE.HemisphereLight(0xb8fff4, 0x2b1218, 1.26);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffdd9a, 2.85);
    sun.position.set(-8, 14, 7);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    scene.add(sun);
    const redLight = new THREE.PointLight(0xb83232, 3.2, 26);
    redLight.position.set(-8, 4, -12);
    scene.add(redLight);
    const playerLight = new THREE.PointLight(0xffd98e, 3.4, 13);
    playerLight.position.set(0, 1.8, 0);
    scene.add(playerLight);

    const materials = {
      floor: new THREE.MeshStandardMaterial({ color: 0x4b443d, roughness: 0.82, metalness: 0.08, emissive: 0x120b08 }),
      wall: new THREE.MeshStandardMaterial({ color: 0x46323a, roughness: 0.78, metalness: 0.12, emissive: 0x10070a }),
      wallTop: new THREE.MeshStandardMaterial({ color: 0x8a683a, roughness: 0.55, metalness: 0.18, emissive: 0x211406 }),
      player: new THREE.MeshStandardMaterial({ color: 0xffd882, roughness: 0.46, metalness: 0.24, emissive: 0x241806 }),
      enemy: new THREE.MeshStandardMaterial({ color: 0x9a2430, roughness: 0.62, metalness: 0.1, emissive: 0x28070a }),
      enemyAlert: new THREE.MeshStandardMaterial({ color: 0xff553f, roughness: 0.42, metalness: 0.1, emissive: 0x5a0906 }),
      boss: new THREE.MeshStandardMaterial({ color: 0xff2f18, roughness: 0.38, metalness: 0.26, emissive: 0x8f1208, emissiveIntensity: 1.65 }),
      bossGold: new THREE.MeshStandardMaterial({ color: 0xffd36a, roughness: 0.34, metalness: 0.38, emissive: 0xff8a18, emissiveIntensity: 1.25 }),
      torii: new THREE.MeshStandardMaterial({ color: 0xd23232, roughness: 0.48, metalness: 0.08, emissive: 0x330808 }),
      light: new THREE.MeshStandardMaterial({ color: 0xdffefa, emissive: 0x75eee5, emissiveIntensity: 1.4 })
    };

    const floorGroup = new THREE.Group();
    const wallGroup = new THREE.Group();
    const fxGroup = new THREE.Group();
    root.add(floorGroup, wallGroup, fxGroup);

    const floorGeo = new THREE.BoxGeometry(TILE * 0.96, 0.18, TILE * 0.96);
    const wallGeo = new THREE.BoxGeometry(TILE, 2.45, TILE);
    const capGeo = new THREE.BoxGeometry(TILE * 1.02, 0.18, TILE * 1.02);
    const particleGeo = new THREE.SphereGeometry(0.055, 8, 6);
    const particles = [];

    function spawnBurst(position, color = 0xffd36a, count = 18, power = 1) {
      for (let i = 0; i < count; i += 1) {
        const material = new THREE.MeshBasicMaterial({
          color,
          transparent: true,
          opacity: 0.95,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        const spark = new THREE.Mesh(particleGeo, material);
        spark.position.copy(position).add(new THREE.Vector3(0, 0.55 + Math.random() * 0.9, 0));
        const angle = Math.random() * Math.PI * 2;
        const radius = (0.8 + Math.random() * 2.2) * power;
        const velocity = new THREE.Vector3(
          Math.cos(angle) * radius,
          (0.9 + Math.random() * 2.8) * power,
          Math.sin(angle) * radius
        );
        const life = 0.55 + Math.random() * 0.52;
        spark.scale.setScalar(1.4 + Math.random() * 2.2);
        fxGroup.add(spark);
        particles.push({ mesh: spark, velocity, life, maxLife: life });
      }
    }

    function burstAtTile(x, y, color, count = 18, power = 1) {
      spawnBurst(tileToWorld(x, y, 0.15), color, count, power);
    }

    function tileToWorld(x, y, z = 0) {
      const w = maze[0].length;
      const h = maze.length;
      return new THREE.Vector3((x - (w - 1) / 2) * TILE, z, (y - (h - 1) / 2) * TILE);
    }

    function isWall(x, y) {
      return y < 0 || y >= maze.length || x < 0 || x >= maze[0].length || maze[y][x] === "#";
    }

    function buildMaze() {
      for (let y = 0; y < maze.length; y += 1) {
        for (let x = 0; x < maze[y].length; x += 1) {
          const ch = maze[y][x];
          const pos = tileToWorld(x, y);
          const floor = new THREE.Mesh(floorGeo, materials.floor);
          floor.position.copy(pos);
          floor.receiveShadow = true;
          floorGroup.add(floor);
          if (ch === "#") {
            const wall = new THREE.Mesh(wallGeo, materials.wall);
            wall.position.copy(pos);
            wall.position.y = 1.22;
            wall.castShadow = true;
            wall.receiveShadow = true;
            wallGroup.add(wall);
            const cap = new THREE.Mesh(capGeo, materials.wallTop);
            cap.position.copy(pos);
            cap.position.y = 2.54;
            cap.receiveShadow = true;
            wallGroup.add(cap);
          }
          if (ch === "E") buildTorii(x, y);
        }
      }
    }

    function buildTorii(x, y) {
      const base = tileToWorld(x, y, 0);
      const torii = new THREE.Group();
      torii.position.copy(base);
      const postGeo = new THREE.BoxGeometry(0.18, 1.9, 0.18);
      const beamGeo = new THREE.BoxGeometry(1.8, 0.18, 0.22);
      const left = new THREE.Mesh(postGeo, materials.torii);
      const right = new THREE.Mesh(postGeo, materials.torii);
      const beam = new THREE.Mesh(beamGeo, materials.torii);
      const glow = new THREE.Mesh(new THREE.SphereGeometry(0.42, 20, 14), materials.light);
      const portalLight = new THREE.PointLight(0x76d7d0, 2.8, 8);
      left.position.set(-0.55, 1.0, 0);
      right.position.set(0.55, 1.0, 0);
      beam.position.set(0, 1.9, 0);
      glow.position.set(0, 0.75, 0);
      portalLight.position.set(0, 1.0, 0);
      torii.add(left, right, beam, glow, portalLight);
      torii.traverse((obj) => { obj.castShadow = true; });
      fxGroup.add(torii);
    }

    function makePlayer() {
      const group = new THREE.Group();
      const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.38, 0.92, 6, 12), materials.player);
      body.position.y = 0.86;
      body.castShadow = true;
      const sword = new THREE.Mesh(new THREE.BoxGeometry(0.09, 1.15, 0.09), materials.light);
      sword.position.set(0.43, 1.05, 0.05);
      sword.rotation.z = -0.42;
      const halo = new THREE.Mesh(new THREE.TorusGeometry(0.54, 0.035, 8, 36), materials.light);
      halo.position.y = 1.55;
      halo.rotation.x = Math.PI / 2;
      group.add(body, sword, halo);
      group.visible = false;
      root.add(group);
      return group;
    }

    function makeEnemy(enemy) {
      const group = new THREE.Group();
      const base = new THREE.Mesh(new THREE.OctahedronGeometry(enemy.boss ? 0.92 : 0.65, 0), enemy.boss ? materials.boss : materials.enemy);
      base.position.y = 0.88;
      base.castShadow = true;
      const flame = new THREE.Mesh(new THREE.ConeGeometry(enemy.boss ? 0.55 : 0.34, enemy.boss ? 1.25 : 0.9, 6), enemy.boss ? materials.bossGold : materials.enemyAlert);
      flame.position.y = enemy.boss ? 1.75 : 1.5;
      group.add(base, flame);
      if (enemy.boss) {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(0.9, 0.045, 8, 42), materials.bossGold);
        ring.position.y = 0.18;
        ring.rotation.x = Math.PI / 2;
        const crown = new THREE.Mesh(new THREE.TorusGeometry(0.58, 0.04, 8, 36), materials.bossGold);
        crown.position.y = 2.42;
        crown.rotation.x = Math.PI / 2;
        group.add(ring, crown);
        const bossLight = new THREE.PointLight(0xff4a1d, 2.2, 7);
        bossLight.position.y = 1.4;
        group.add(bossLight);
        group.scale.setScalar(1.34);
      }
      enemy.mesh = group;
      group.position.copy(tileToWorld(enemy.x, enemy.y));
      root.add(group);
    }

    buildMaze();
    const playerMesh = makePlayer();
    enemies.forEach(makeEnemy);
    setPlayerTarget();

    function setPlayerTarget() {
      state.target.copy(tileToWorld(state.player.x, state.player.y));
    }

    function facingVector() {
      return [
        { x: 0, y: -1 },
        { x: 1, y: 0 },
        { x: 0, y: 1 },
        { x: -1, y: 0 }
      ][state.facing];
    }

    function turnPlayer(step) {
      if (state.mode !== "explore" || state.moveLock > 0) return;
      state.facing = (state.facing + step + 4) % 4;
      state.targetYaw = state.facing * Math.PI / 2;
      state.moveLock = 0.12;
    }

    function moveRelative(step) {
      const dir = facingVector();
      tryMove(dir.x * step, dir.y * step);
    }

    function tryMove(dx, dy) {
      if (state.mode !== "explore" || state.moveLock > 0) return;
      const nx = state.player.x + dx;
      const ny = state.player.y + dy;
      if (isWall(nx, ny)) {
        bumpPlayer(dx, dy);
        return;
      }
      state.player.x = nx;
      state.player.y = ny;
      state.moveLock = 0.15;
      setPlayerTarget();
      playerMesh.lookAt(tileToWorld(nx + dx, ny + dy));
      playStep();
      if (guardExitWithBoss(nx, ny)) return;
      checkEncounter();
      if (maze[ny][nx] === "E") {
        playVictory();
        triggerImpact("victory");
        burstAtTile(nx, ny, 0xfff0a0, 54, 1.25);
        showEnd("地上へ帰還", "イザナギは黄泉比良坂を抜け、光の鳥居から地上へ戻った。", "victory");
      }
    }

    function bumpPlayer(dx, dy) {
      const offset = tileToWorld(state.player.x, state.player.y);
      offset.x += dx * 0.18;
      offset.z += dy * 0.18;
      playerMesh.position.lerp(offset, 0.7);
    }

    function checkEncounter() {
      const enemy = enemies.find((e) => e.state !== "defeated" && e.x === state.player.x && e.y === state.player.y);
      if (enemy) startBattle(enemy);
    }

    function getExitBoss() {
      return enemies.find((enemy) => enemy.boss && enemy.state !== "defeated");
    }

    function guardExitWithBoss(nx, ny) {
      const boss = getExitBoss();
      if (!boss) return false;
      const nearExit = maze[ny][nx] === "E" || (ny === 7 && nx >= 8);
      if (!nearExit) return false;
      boss.x = nx;
      boss.y = ny;
      boss.state = "alert";
      if (boss.mesh) boss.mesh.position.copy(tileToWorld(boss.x, boss.y));
      battleLog.textContent = `${boss.name}が出口前へ瞬間移動した。`;
      burstAtTile(nx, ny, 0xff4a1d, 42, 1.35);
      startBattle(boss);
      return true;
    }

    function startBattle(enemy) {
      state.mode = "battle";
      state.activeEnemy = enemy;
      state.battleBusy = false;
      state.guardBonus = 0;
      enemy.state = "alert";
      enemy.turns = 0;
      enemy.intent = rollEnemyIntent(enemy);
      enemyText.textContent = enemy.name;
      battle.classList.add("active");
      battle.classList.toggle("bossBattle", !!enemy.boss);
      battlePortrait.classList.remove("defeatFade");
      battlePortrait.classList.remove("bossDefeatFade");
      battleLog.textContent = `${enemy.name}が黄泉路をふさいだ。\n次: ${describeIntent(enemy.intent)}`;
      playBattleStart(!!enemy.boss);
      triggerImpact(enemy.boss ? "boss" : "enemy");
      if (enemy.mesh) spawnBurst(enemy.mesh.position, enemy.boss ? 0xff4a1d : 0xd6aa58, enemy.boss ? 34 : 18, enemy.boss ? 1.25 : 0.85);
      setActionButtonsEnabled(true);
      drawBattlePortrait(enemy);
      updateBattleUi();
    }

    function rollEnemyIntent(enemy) {
      enemy.turns = enemy.turns || 0;
      if (enemy.boss) {
        if (enemy.hp <= enemy.maxHp * 0.42 && enemy.turns % 3 === 1) return "rage";
        if (enemy.turns % 3 === 2) return "curse";
        return "cleave";
      }
      if (enemy.weakPurify && enemy.turns % 2 === 1) return "curse";
      if (enemy.armored && enemy.turns % 3 === 2) return "heavy";
      return "strike";
    }

    function describeIntent(intent) {
      return {
        strike: "通常攻撃",
        heavy: "強打",
        curse: "穢れ",
        cleave: "薙ぎ払い",
        rage: "黄泉の大技"
      }[intent] || "攻撃";
    }

    function drawBattlePortrait(enemy) {
      const ctx = battlePortraitCtx;
      const w = battlePortrait.width;
      const h = battlePortrait.height;
      ctx.clearRect(0, 0, w, h);
      if (enemy.useSheet && (enemySheetReady || (enemySheet.complete && enemySheet.naturalWidth > 0))) {
        try {
          drawEnemySheetPortrait(ctx, enemy, w, h);
          return;
        } catch (error) {
          console.warn("enemy sheet portrait failed, using fallback", error);
        }
      }
      if (enemy.useSheet && !enemySheetFailed) {
        drawLoadingPortrait(ctx, enemy, w, h);
        enemySheet.decode?.().then(() => {
          enemySheetReady = true;
          if (state.activeEnemy === enemy) drawBattlePortrait(enemy);
        }).catch(() => {
          enemySheetFailed = true;
          if (state.activeEnemy === enemy) drawBattlePortrait(enemy);
        });
        return;
      }
      drawProceduralPortrait(ctx, enemy, w, h);
    }

    function drawLoadingPortrait(ctx, enemy, w, h) {
      const bg = ctx.createRadialGradient(w * 0.5, h * 0.42, 20, w * 0.5, h * 0.5, w * 0.68);
      bg.addColorStop(0, "rgba(255,235,180,.24)");
      bg.addColorStop(0.52, "rgba(23,12,16,.95)");
      bg.addColorStop(1, "rgba(4,2,5,.98)");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = "#ffd47a";
      ctx.lineWidth = 18;
      ctx.strokeRect(28, 28, w - 56, h - 56);
      ctx.strokeStyle = "rgba(255,246,210,.62)";
      ctx.lineWidth = 5;
      ctx.strokeRect(50, 50, w - 100, h - 100);
      ctx.fillStyle = "#f2e7cf";
      ctx.font = "bold 42px Yu Gothic UI, sans-serif";
      ctx.textAlign = "center";
      ctx.shadowColor = "rgba(0,0,0,.9)";
      ctx.shadowBlur = 14;
      ctx.fillText(enemy.name, w / 2, h * 0.5 - 12);
      ctx.font = "bold 24px Yu Gothic UI, sans-serif";
      ctx.fillStyle = "#ffdc86";
      ctx.fillText("敵イラスト読込中", w / 2, h * 0.5 + 42);
      ctx.shadowBlur = 0;
    }

    function drawEnemySheetPortrait(ctx, enemy, w, h) {
      const boxes = {
        1: { x: 0.02, y: 0.13, w: 0.31, h: 0.75 },
        2: { x: 0.34, y: 0.06, w: 0.30, h: 0.82 },
        3: { x: 0.64, y: 0.12, w: 0.34, h: 0.76 },
        4: { x: 0.64, y: 0.10, w: 0.34, h: 0.78 }
      };
      const crop = boxes[enemy.id] || boxes[1];
      const iw = enemySheet.naturalWidth;
      const ih = enemySheet.naturalHeight;
      const sx = crop.x * iw;
      const sy = crop.y * ih;
      const sw = crop.w * iw;
      const sh = crop.h * ih;
      const bg = ctx.createRadialGradient(w * 0.5, h * 0.42, 20, w * 0.5, h * 0.5, w * 0.68);
      bg.addColorStop(0, "rgba(255,235,180,.35)");
      bg.addColorStop(0.52, "rgba(23,12,16,.95)");
      bg.addColorStop(1, "rgba(4,2,5,.98)");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);
      ctx.save();
      ctx.beginPath();
      ctx.roundRect(36, 36, w - 72, h - 72, 28);
      ctx.clip();
      const scale = Math.min((w - 96) / sw, (h - 110) / sh);
      const dw = sw * scale;
      const dh = sh * scale;
      const dx = (w - dw) / 2;
      const dy = Math.max(64, (h - dh) / 2 + 12);
      ctx.shadowColor = "rgba(0,0,0,.86)";
      ctx.shadowBlur = 30;
      const cleaned = cleanEnemyCrop(enemySheet, sx, sy, sw, sh, Math.max(1, Math.floor(dw)), Math.max(1, Math.floor(dh)));
      ctx.drawImage(cleaned, dx, dy, dw, dh);
      ctx.restore();
      const vignette = ctx.createRadialGradient(w * 0.5, h * 0.45, w * 0.18, w * 0.5, h * 0.5, w * 0.68);
      vignette.addColorStop(0, "rgba(0,0,0,0)");
      vignette.addColorStop(1, "rgba(0,0,0,.62)");
      ctx.fillStyle = vignette;
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = "#ffd47a";
      ctx.lineWidth = 18;
      ctx.strokeRect(28, 28, w - 56, h - 56);
      ctx.strokeStyle = "rgba(255,246,210,.62)";
      ctx.lineWidth = 5;
      ctx.strokeRect(50, 50, w - 100, h - 100);
      ctx.fillStyle = "#f2e7cf";
      ctx.font = "bold 54px Yu Gothic UI, sans-serif";
      ctx.textAlign = "center";
      ctx.shadowColor = "rgba(0,0,0,.95)";
      ctx.shadowBlur = 14;
      ctx.fillText(enemy.name, w / 2, h - 62);
      ctx.shadowBlur = 0;
    }

    function cleanEnemyCrop(image, sx, sy, sw, sh, dw, dh) {
      const c = document.createElement("canvas");
      c.width = dw;
      c.height = dh;
      const cctx = c.getContext("2d", { willReadFrequently: true });
      cctx.drawImage(image, sx, sy, sw, sh, 0, 0, dw, dh);
      const data = cctx.getImageData(0, 0, dw, dh);
      const px = data.data;
      for (let i = 0; i < px.length; i += 4) {
        const r = px[i];
        const g = px[i + 1];
        const b = px[i + 2];
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        if (max - min < 14 && max > 88) {
          px[i + 3] = 0;
        }
      }
      cctx.putImageData(data, 0, 0);
      return c;
    }

    function drawProceduralPortrait(ctx, enemy, w, h) {
      const palette = {
        1: ["#3b0d18", "#d53e34", "#ffd47a", "#171018"],
        2: ["#1d0b2e", "#8b53ff", "#76d7d0", "#0d1520"],
        3: ["#151212", "#d6aa58", "#b83232", "#21170f"]
      }[enemy.id] || ["#301018", "#d6aa58", "#f2e7cf", "#100b11"];
      const bg = ctx.createRadialGradient(w * 0.5, h * 0.36, 18, w * 0.5, h * 0.5, w * 0.72);
      bg.addColorStop(0, "rgba(255,240,190,.45)");
      bg.addColorStop(0.45, palette[3]);
      bg.addColorStop(1, "rgba(4,2,5,.98)");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);
      for (let i = 0; i < 52; i += 1) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        ctx.fillStyle = i % 3 === 0 ? "rgba(255,220,130,.18)" : "rgba(255,255,255,.08)";
        ctx.beginPath();
        ctx.arc(x, y, 1 + Math.random() * 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.strokeStyle = palette[2];
      ctx.lineWidth = 18;
      ctx.strokeRect(28, 28, w - 56, h - 56);
      ctx.strokeStyle = "rgba(255,246,210,.62)";
      ctx.lineWidth = 5;
      ctx.strokeRect(50, 50, w - 100, h - 100);
      ctx.save();
      ctx.translate(w / 2, h / 2 + 42);
      const aura = ctx.createRadialGradient(0, -90, 20, 0, -50, 270);
      aura.addColorStop(0, palette[2]);
      aura.addColorStop(0.5, "rgba(214,170,88,.22)");
      aura.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = aura;
      ctx.beginPath();
      ctx.ellipse(0, -64, 260, 330, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(255,230,160,.72)";
      ctx.lineWidth = 6;
      for (let i = 0; i < 16; i += 1) {
        ctx.save();
        ctx.rotate((Math.PI * 2 * i) / 16);
        ctx.beginPath();
        ctx.moveTo(0, -130);
        ctx.lineTo(0, -292);
        ctx.stroke();
        ctx.restore();
      }
      ctx.fillStyle = palette[0];
      ctx.beginPath();
      ctx.ellipse(0, 56, 148, 190, 0, 0, Math.PI * 2);
      ctx.fill();
      const robe = ctx.createLinearGradient(-140, -60, 150, 220);
      robe.addColorStop(0, palette[1]);
      robe.addColorStop(0.5, palette[0]);
      robe.addColorStop(1, "#090508");
      ctx.fillStyle = robe;
      ctx.beginPath();
      ctx.moveTo(-172, 230);
      ctx.bezierCurveTo(-132, -40, -78, -122, 0, -120);
      ctx.bezierCurveTo(92, -118, 146, -38, 176, 230);
      ctx.quadraticCurveTo(0, 286, -172, 230);
      ctx.fill();
      ctx.strokeStyle = "rgba(255,220,140,.48)";
      ctx.lineWidth = 9;
      for (let i = -3; i <= 3; i += 1) {
        ctx.beginPath();
        ctx.moveTo(i * 28, -90);
        ctx.bezierCurveTo(i * 18, 0, i * 34, 98, i * 16, 228);
        ctx.stroke();
      }
      ctx.fillStyle = palette[1];
      ctx.beginPath();
      ctx.moveTo(-134, -96);
      ctx.lineTo(-224, -252);
      ctx.lineTo(-54, -154);
      ctx.lineTo(0, -294);
      ctx.lineTo(54, -154);
      ctx.lineTo(224, -252);
      ctx.lineTo(134, -96);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "rgba(255,236,170,.8)";
      ctx.lineWidth = 8;
      ctx.stroke();
      ctx.fillStyle = "#1b1118";
      ctx.beginPath();
      ctx.ellipse(0, -52, 88, 104, 0, 0, Math.PI * 2);
      ctx.fill();
      const face = ctx.createLinearGradient(0, -118, 0, 28);
      face.addColorStop(0, "#ffe0a6");
      face.addColorStop(1, "#b66b4f");
      ctx.fillStyle = face;
      ctx.beginPath();
      ctx.ellipse(0, -42, 72, 86, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#f8dca0";
      ctx.beginPath();
      ctx.arc(-30, -54, 12, 0, Math.PI * 2);
      ctx.arc(30, -54, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#100b11";
      ctx.beginPath();
      ctx.arc(-30, -54, 5, 0, Math.PI * 2);
      ctx.arc(30, -54, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#2b0710";
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.moveTo(-34, 12);
      ctx.quadraticCurveTo(0, 42, 36, 12);
      ctx.stroke();
      ctx.strokeStyle = "rgba(255,235,176,.86)";
      ctx.lineWidth = 12;
      ctx.beginPath();
      ctx.moveTo(-172, 116);
      ctx.lineTo(162, -166);
      ctx.stroke();
      ctx.fillStyle = "#fff3c4";
      ctx.beginPath();
      ctx.arc(172, -174, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = "#f2e7cf";
      ctx.font = "bold 54px Yu Gothic UI, sans-serif";
      ctx.textAlign = "center";
      ctx.shadowColor = "rgba(0,0,0,.9)";
      ctx.shadowBlur = 14;
      ctx.fillText(enemy.name, w / 2, h - 62);
      ctx.shadowBlur = 0;
    }

    function updateBattleUi() {
      const enemy = state.activeEnemy;
      hpText.textContent = `${state.hp}/${state.maxHp}`;
      playerBattleStatus.textContent = `イザナギ HP ${state.hp}/${state.maxHp} | 薬 ${state.potions}`;
      playerBattleStatus.style.setProperty("--player-hp", `${Math.max(0, state.hp / state.maxHp) * 100}%`);
      enemyText.textContent = enemy ? enemy.name : "なし";
      if (enemy) {
        battleName.textContent = enemy.name;
        battleHp.textContent = `HP ${Math.max(0, enemy.hp)}/${enemy.maxHp}`;
        battleHp.style.setProperty("--enemy-hp", `${Math.max(0, enemy.hp / enemy.maxHp) * 100}%`);
      }
    }

    function setActionButtonsEnabled(enabled) {
      actionButtons.forEach((button) => {
        const blockedRun = button.dataset.action === "run" && state.activeEnemy && state.activeEnemy.boss;
        button.disabled = !enabled || blockedRun;
      });
    }

    function act(action) {
      if (state.mode !== "battle" || !state.activeEnemy || state.battleBusy) return;
      ensureAudio();
      const enemy = state.activeEnemy;
      let guard = false;
      let log = "";
      state.battleBusy = true;
      setActionButtonsEnabled(false);
      if (action === "attack") {
        let damage = 6 + Math.floor(Math.random() * 4);
        const critical = Math.random() < (enemy.armored ? 0.18 : 0.12);
        if (critical) damage += 5;
        enemy.hp -= damage;
        log = critical ? `会心の斬撃。${damage}ダメージ。` : `剣で斬りつけた。${damage}ダメージ。`;
        critical ? playCritical() : playSlash();
        triggerImpact(critical ? "heavy" : "slash");
        showFloat(critical ? `${damage} CRITICAL` : `${damage}`, critical ? "bad" : "");
        if (enemy.mesh) spawnBurst(enemy.mesh.position, critical ? 0xfff0a0 : 0xffd36a, critical ? 30 : 18, critical ? 1.25 : 0.85);
      } else if (action === "guard") {
        guard = true;
        state.guardBonus = Math.min(2, state.guardBonus + 1);
        const before = state.hp;
        state.hp = Math.min(state.maxHp, state.hp + 2);
        log = `防御を固めた。被ダメージを大きく抑える。HP ${before} -> ${state.hp}`;
        playGuard();
        triggerImpact("guard");
        showFloat("GUARD", "good");
        spawnBurst(playerMesh.position, 0x76d7d0, 20, 0.75);
      } else if (action === "purify") {
        let damage = 4 + Math.floor(Math.random() * 6);
        if (enemy.weakPurify) damage += 6;
        if (enemy.boss && enemy.hp <= enemy.maxHp * 0.5) damage += 3;
        enemy.hp -= damage;
        log = enemy.weakPurify ? `禊の光が弱点を貫いた。${damage}ダメージ。` : `禊の光を放つ。${damage}ダメージ。`;
        playPurify();
        triggerImpact("purify");
        showFloat(`${damage}`, "good");
        if (enemy.mesh) spawnBurst(enemy.mesh.position, 0x76d7d0, 32, 1.1);
      } else if (action === "heal") {
        if (state.potions <= 0) {
          battleLog.textContent = "回復薬はもう残っていない。";
          state.battleBusy = false;
          setActionButtonsEnabled(true);
          return;
        }
        const before = state.hp;
        state.potions -= 1;
        state.hp = Math.min(state.maxHp, state.hp + 16);
        log = `回復薬を使った。HP ${before} -> ${state.hp}。`;
        playHeal();
        triggerImpact("heal");
        showFloat(`+${state.hp - before}`, "good");
        spawnBurst(playerMesh.position, 0x76d7d0, 26, 0.8);
      } else if (action === "run") {
        if (enemy.boss) {
          battleLog.textContent = "出口を塞ぐ敵からは逃げられない。";
          state.battleBusy = false;
          setActionButtonsEnabled(true);
          return;
        }
        const escaped = Math.random() > 0.28;
        if (escaped) {
          battleLog.textContent = "距離を取り、迷宮へ戻った。";
          state.battleBusy = false;
          setActionButtonsEnabled(true);
          endBattle(false);
          return;
        }
        log = "逃げ道を塞がれた。";
      }
      if (enemy.hp <= 0) {
        const rewardHp = enemy.rewardHp || 0;
        if (rewardHp > 0) state.hp = Math.min(state.maxHp, state.hp + rewardHp);
        if (enemy.weakPurify && state.potions < 3) state.potions += 1;
        battleLog.textContent = `${log} ${enemy.name}を退けた。${rewardHp ? ` 呼吸を整えHPが${rewardHp}回復。` : ""}`;
        enemy.state = "defeated";
        state.defeated += 1;
        if (enemy.mesh) {
          spawnBurst(enemy.mesh.position, enemy.boss ? 0xfff0a0 : 0xff4a1d, enemy.boss ? 70 : 36, enemy.boss ? 1.55 : 1.1);
          enemy.mesh.visible = false;
        }
        if (enemy.boss) {
          battleLog.textContent = `${log} ${enemy.name}が地鳴りと共に崩れていく。出口の鳥居が開いた。`;
          playBossQuake();
        } else {
          playDefeatBoom();
        }
        triggerImpact("enemy");
        showFloat(enemy.boss ? "BOSS DOWN" : "DEFEATED", enemy.boss ? "good" : "");
        battlePortrait.classList.remove("defeatFade");
        battlePortrait.classList.remove("bossDefeatFade");
        void battlePortrait.offsetWidth;
        battlePortrait.classList.add(enemy.boss ? "bossDefeatFade" : "defeatFade");
        updateBattleUi();
        window.setTimeout(() => {
          battlePortrait.classList.remove("defeatFade");
          battlePortrait.classList.remove("bossDefeatFade");
          endBattle(true);
        }, enemy.boss ? 2700 : 1150);
        return;
      }
      battleLog.textContent = `${log}\n${enemy.name}の構え: ${describeIntent(enemy.intent)}`;
      updateBattleUi();
      window.setTimeout(() => enemyTurn(guard), 760);
    }

    function enemyTurn(guard) {
      const enemy = state.activeEnemy;
      if (state.mode !== "battle" || !enemy) return;
      const intent = enemy.intent || "strike";
      const intentBonus = { strike: 0, heavy: 3, curse: 2, cleave: 2, rage: 5 }[intent] || 0;
      let incoming = enemy.atk + intentBonus + Math.floor(Math.random() * 3);
      if (guard) incoming = Math.max(1, Math.ceil(incoming * (enemy.boss ? 0.42 : 0.34)) - state.guardBonus);
      if (intent === "curse" && !guard) state.potions = Math.max(0, state.potions - (enemy.boss ? 1 : 0));
      state.hp -= incoming;
      const guardText = guard ? "防御で受け流した。" : "";
      const curseText = intent === "curse" && !guard && enemy.boss ? " 回復薬が1つ穢れた。" : "";
      battleLog.textContent = `${enemy.name}の${describeIntent(intent)}。${guardText}${incoming}ダメージ。${curseText}`;
      playImpact();
      triggerImpact("enemy");
      showFloat(`-${incoming}`, "bad");
      spawnBurst(playerMesh.position, intent === "curse" ? 0x8b53ff : 0xff4a1d, intent === "rage" ? 36 : 22, intent === "rage" ? 1.25 : 0.85);
      if (state.hp <= 0) {
        state.hp = 0;
        showEnd("黄泉へ沈む", "力尽きた。入口付近から再挑戦できる。", "downed");
        state.battleBusy = false;
        setActionButtonsEnabled(true);
        updateBattleUi();
        return;
      }
      enemy.turns = (enemy.turns || 0) + 1;
      enemy.intent = rollEnemyIntent(enemy);
      state.guardBonus = 0;
      window.setTimeout(() => {
        state.battleBusy = false;
        setActionButtonsEnabled(true);
        battleLog.textContent = `どうする？\n次: ${describeIntent(enemy.intent)}`;
      }, 520);
      updateBattleUi();
    }

    function endBattle(won) {
      const enemy = state.activeEnemy;
      battle.classList.remove("active");
      battle.classList.remove("bossBattle");
      state.activeEnemy = null;
      state.battleBusy = false;
      setActionButtonsEnabled(true);
      state.mode = "explore";
      enemyText.textContent = "なし";
      if (!won && enemy && enemy.state !== "defeated") {
        enemy.state = "patrol";
        state.player.x = Math.max(1, state.player.x - 1);
        setPlayerTarget();
      }
      updateBattleUi();
    }

    function showEnd(title, body, mode) {
      state.mode = mode;
      battle.classList.remove("active");
      battle.classList.remove("bossBattle");
      state.battleBusy = false;
      setActionButtonsEnabled(true);
      if (mode === "victory") {
        endingScene.classList.add("active");
        message.classList.remove("active");
        return;
      }
      messageTitle.textContent = title;
      messageBody.textContent = body;
      message.classList.add("active");
      updateBattleUi();
    }

    function restart() {
      state.mode = "explore";
      state.hp = state.maxHp;
      state.potions = 3;
      state.player.x = 1;
      state.player.y = 1;
      state.facing = 1;
      state.yaw = Math.PI / 2;
      state.targetYaw = Math.PI / 2;
      state.activeEnemy = null;
      state.battleBusy = false;
      state.guardBonus = 0;
      state.defeated = 0;
      setActionButtonsEnabled(true);
      enemies.forEach((enemy, index) => {
        const starts = [{ x: 6, y: 9 }, { x: 4, y: 11 }, { x: 9, y: 3 }, { x: 10, y: 7 }];
        enemy.x = starts[index].x;
        enemy.y = starts[index].y;
        if (enemy.boss) enemy.routeIndex = 0;
        enemy.hp = enemy.maxHp;
        enemy.state = "patrol";
        enemy.turns = 0;
        enemy.intent = null;
        if (enemy.mesh) {
          enemy.mesh.visible = true;
          enemy.mesh.position.copy(tileToWorld(enemy.x, enemy.y));
        }
      });
      setPlayerTarget();
      message.classList.remove("active");
      endingScene.classList.remove("active");
      enemyText.textContent = "なし";
      updateBattleUi();
    }

    function updateEnemies(dt) {
      if (state.mode !== "explore") return;
      state.turn += dt;
      if (state.turn < 0.8) return;
      state.turn = 0;
      enemies.forEach((enemy) => {
        if (enemy.state !== "patrol") return;
        if (enemy.boss) {
          const route = [{ x: 10, y: 7 }, { x: 9, y: 7 }, { x: 9, y: 8 }, { x: 10, y: 7 }];
          enemy.routeIndex = (enemy.routeIndex + 1) % route.length;
          enemy.x = route[enemy.routeIndex].x;
          enemy.y = route[enemy.routeIndex].y;
          if (enemy.x === state.player.x && enemy.y === state.player.y) startBattle(enemy);
          return;
        }
        const dx = enemy.dir;
        if (!isWall(enemy.x + dx, enemy.y)) {
          enemy.x += dx;
        } else if (!isWall(enemy.x, enemy.y - enemy.dir)) {
          enemy.y -= enemy.dir;
        } else {
          enemy.dir *= -1;
        }
        if (enemy.x === state.player.x && enemy.y === state.player.y) startBattle(enemy);
      });
    }

    function updateMeshes(dt, elapsed) {
      playerMesh.position.lerp(state.target, Math.min(1, dt * 8));
      playerMesh.position.y = Math.sin(elapsed * 5) * 0.055;
      enemies.forEach((enemy) => {
        if (!enemy.mesh || !enemy.mesh.visible) return;
        const target = tileToWorld(enemy.x, enemy.y);
        enemy.mesh.position.lerp(target, Math.min(1, dt * 4));
        enemy.mesh.position.y = Math.sin(elapsed * (enemy.boss ? 5.5 : 4) + enemy.id) * (enemy.boss ? 0.2 : 0.12);
        enemy.mesh.rotation.y += dt * (enemy.boss ? 2.6 : (enemy.state === "alert" ? 3.6 : 1.2));
        const pulse = enemy.state === "alert" ? 1 + Math.sin(elapsed * 8) * 0.045 : 1;
        enemy.mesh.scale.setScalar((enemy.boss ? 1.34 : 1) * pulse);
      });
      fxGroup.children.forEach((child, index) => {
        child.rotation.y = Math.sin(elapsed * 0.7 + index) * 0.08;
      });
      redLight.intensity = 2.8 + Math.sin(elapsed * 1.6) * 0.45 + (state.mode === "battle" ? 0.8 : 0);
      playerLight.position.copy(playerMesh.position).add(new THREE.Vector3(0, 1.6, 0));
      playerLight.intensity = 3.2 + Math.sin(elapsed * 7.5) * 0.22 + (state.mode === "battle" ? 0.65 : 0);
      for (let i = particles.length - 1; i >= 0; i -= 1) {
        const p = particles[i];
        p.life -= dt;
        p.velocity.y -= dt * 2.15;
        p.mesh.position.addScaledVector(p.velocity, dt);
        const t = Math.max(0, p.life / p.maxLife);
        p.mesh.material.opacity = t * 0.95;
        p.mesh.scale.setScalar(0.7 + t * 2.3);
        if (p.life <= 0) {
          fxGroup.remove(p.mesh);
          p.mesh.material.dispose();
          particles.splice(i, 1);
        }
      }
    }

    function updateCamera(dt) {
      const turnDelta = Math.atan2(Math.sin(state.targetYaw - state.yaw), Math.cos(state.targetYaw - state.yaw));
      state.yaw += turnDelta * Math.min(1, dt * 8);
      const dir = {
        x: Math.sin(state.yaw),
        y: -Math.cos(state.yaw)
      };
      const eye = playerMesh.position.clone().add(new THREE.Vector3(0, 1.35, 0));
      const look = eye.clone().add(new THREE.Vector3(dir.x * 7, 0.05, dir.y * 7));
      camera.position.lerp(eye, Math.min(1, dt * 10));
      camera.lookAt(look);
    }

    function resize() {
      const rect = viewport.getBoundingClientRect();
      camera.aspect = rect.width / rect.height;
      camera.updateProjectionMatrix();
      renderer.setSize(rect.width, rect.height, false);
    }

    window.addEventListener("resize", resize);
    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      if (["arrowup", "arrowdown", "arrowleft", "arrowright", "w", "a", "s", "d"].includes(key)) {
        event.preventDefault();
        ensureAudio();
      }
      if (key === "w" || key === "arrowup") moveRelative(1);
      if (key === "s" || key === "arrowdown") moveRelative(-1);
      if (key === "a" || key === "arrowleft") turnPlayer(-1);
      if (key === "d" || key === "arrowright") turnPlayer(1);
      if (key === "enter" && message.classList.contains("active")) restart();
    });
    document.querySelectorAll("[data-action]").forEach((button) => {
      button.addEventListener("click", () => act(button.dataset.action));
    });
    document.getElementById("restart").addEventListener("click", restart);
    document.getElementById("endingRestart").addEventListener("click", restart);
    if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
      window.__yomiDebug = {
        battle(id = 1) {
          const enemy = enemies.find((target) => target.id === id && target.state !== "defeated");
          if (enemy) startBattle(enemy);
        },
        ending() {
          playVictory();
          triggerImpact("victory");
          showEnd("地上へ帰還", "イザナギは黄泉比良坂を抜け、光の鳥居から地上へ戻った。", "victory");
        }
      };
    }

    resize();
    updateBattleUi();
    if (new URLSearchParams(location.search).get("ending") === "1") {
      window.setTimeout(() => window.__yomiDebug?.ending(), 450);
    }
    const clock = new THREE.Clock();
    function animate() {
      const dt = Math.min(0.05, clock.getDelta());
      const elapsed = clock.elapsedTime;
      state.moveLock = Math.max(0, state.moveLock - dt);
      updateEnemies(dt);
      updateMeshes(dt, elapsed);
      updateCamera(dt);
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
